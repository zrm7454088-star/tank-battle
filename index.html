<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 Tank Battle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0e;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
  }
  canvas {
    display: block;
    background: #111;
    image-rendering: auto;
    /* 保持比例自适应窗口大小 */
    max-width: 100vw;
    max-height: 100vh;
    width: auto; height: auto;
    box-shadow: 0 0 40px rgba(0,0,0,.6);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";
/* ============================================================
   坦克大战 · Tank Battle  (网页版 HTML5 Canvas)
   操作：方向键/WASD 移动，空格开火，P 暂停，R 重开，Esc 退出(回到开始)
   ============================================================ */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ---------- 基础尺寸（逻辑像素） ----------
const TILE = 40, HUD_H = 72, BOTTOM_PAD = 20;
const COLS = 20, ROWS = 13;
const SCREEN_W = COLS * TILE;                     // 800
const SCREEN_H = HUD_H + ROWS * TILE + BOTTOM_PAD; // 612
const TANK_SIZE = 36, BULLET_SIZE = 6;
canvas.width = SCREEN_W; canvas.height = SCREEN_H;

// ---------- 颜色 ----------
const C = {
  hud: "#0c0c10", line: "#46465a", text: "#e6e6eb", hint: "#9696a5",
  field: "rgba(15,15,20,0.72)",
  player: "#2ecc71", playerDark: "#1f8b4d",
  enemy: "#e74c3c", enemyDark: "#a93226",
  brick: "#b06428", brickDark: "#784014",
  steel: "#969ba5", steelDark: "#5f646e", steelLight: "#cdd2dc",
  author: "#d4b25c", gold: "#ffd76a",
};

// ---------- 难度梯度 ----------
const DIFF = {
  easy:   { label: "简单", lives: 5, totalEnemies: 4, maxOnScreen: 2,
            playerSpeed: 240, enemySpeed: 100, bulletSpeed: 470,
            fireCd: 0.28, enemyFire: [1.6, 3.6] },
  normal: { label: "普通", lives: 3, totalEnemies: 6, maxOnScreen: 3,
            playerSpeed: 220, enemySpeed: 130, bulletSpeed: 440,
            fireCd: 0.35, enemyFire: [1.2, 3.0] },
  hard:   { label: "困难", lives: 2, totalEnemies: 8, maxOnScreen: 3,
            playerSpeed: 200, enemySpeed: 175, bulletSpeed: 410,
            fireCd: 0.42, enemyFire: [0.8, 2.2] },
};
const DIFF_ORDER = ["easy", "normal", "hard"];
let difficulty = "normal";
let cfg = DIFF[difficulty];

// ---------- 地图（# 砖墙可破坏，@ 钢墙不可破坏，. 空地） ----------
const MAP = [
  "....................",
  "....................",
  ".##.##........##.##.",
  ".#..###..@@..###..#.",
  ".#..###..##..###..#.",
  "....................",
  "..##..@@@@@@@@..##..",
  "....................",
  "....#.#......#.#....",
  "....#.#......#.#....",
  "....................",
  "....................",
  "....................",
];

const DIRS = [ {dx:0,dy:-1}, {dx:0,dy:1}, {dx:-1,dy:0}, {dx:1,dy:0} ];

// ---------- 出生点 ----------
const PLAYER_SPAWN = { x: (COLS/2)*TILE + TILE/2, y: HUD_H + (ROWS-1)*TILE + TILE/2 };
const ENEMY_SPAWNS = [
  { x: TILE/2, y: HUD_H + TILE/2 },
  { x: (COLS/2)*TILE + TILE/2, y: HUD_H + TILE/2 },
  { x: (COLS-1)*TILE + TILE/2, y: HUD_H + TILE/2 },
];

// ---------- 游戏状态 ----------
let state = "start";            // start / playing / win / gameover
let paused = false;
let settingsOpen = false;
let score = 0;
let spawned = 0;
let respawnTimer = 0;
let player = null;
let enemies = [], bullets = [], walls = [], explosions = [], popups = [];

// ---------- 输入 ----------
const keys = {};
window.addEventListener("keydown", e => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) {
    e.preventDefault();
  }
  const k = e.key.toLowerCase();
  if (!keys[k]) { keyPressed(e.key); }  // 边沿触发（暂停/重开/开始等）
  keys[k] = true;
});
window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

function keyPressed(key) {
  if (key === "Escape") {
    if (settingsOpen) { settingsOpen = false; }
    else if (state === "playing") { state = "start"; resetToStart(); }
  } else if (key === "p" || key === "P") {
    if (!settingsOpen && state === "playing") paused = !paused;
  } else if (key === "r" || key === "R") {
    if (!settingsOpen) { resetToStart(); state = "playing"; startGame(); }
  } else if (key === " " || key === "Enter") {
    if (settingsOpen) return;
    if (state === "start") { startGame(); }
    else if (state === "win" || state === "gameover") { resetToStart(); state = "playing"; startGame(); }
  }
}

// ---------- 背景图 ----------
const bgImg = new Image();
bgImg.src = "background_wave.png";
let bgReady = false;
bgImg.onload = () => { bgReady = true; };
bgImg.onerror = () => { bgReady = false; };

// ---------- 工具函数 ----------
function rnd(a, b) { return a + Math.random() * (b - a); }
function tankRect(t) { return { x: t.x - TANK_SIZE/2, y: t.y - TANK_SIZE/2, w: TANK_SIZE, h: TANK_SIZE }; }
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function inField(t) {
  const r = tankRect(t);
  return r.x >= 0 && r.y >= HUD_H && r.x + r.w <= SCREEN_W && r.y + r.h <= HUD_H + ROWS*TILE;
}

// ---------- 建墙 ----------
function buildWalls() {
  walls = [];
  const spawnCells = new Set();
  for (const c of [0, Math.floor(COLS/2), COLS-1]) spawnCells.add("0,"+c);
  spawnCells.add((ROWS-1) + "," + Math.floor(COLS/2));
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ch = MAP[r][c];
      if ((ch === "#" || ch === "@") && !spawnCells.has(r+","+c)) {
        walls.push({ x: c*TILE, y: HUD_H + r*TILE, w: TILE, h: TILE, kind: ch === "#" ? "brick" : "steel", alive: true });
      }
    }
  }
}

// ---------- 坦克 / 子弹 ----------
function makePlayer() {
  return { x: PLAYER_SPAWN.x, y: PLAYER_SPAWN.y, dir: DIRS[0],
           lives: cfg.lives, alive: true, invincible: 2, fireCd: 0, isPlayer: true };
}
function makeEnemy(x, y) {
  return { x, y, dir: DIRS[Math.floor(rnd(0,4))], alive: true,
           fireTimer: rnd(cfg.enemyFire[0], cfg.enemyFire[1]), isPlayer: false };
}

function resetToStart() {
  buildWalls();
  player = makePlayer();
  enemies = []; bullets = []; explosions = []; popups = [];
  spawned = 0; respawnTimer = 0; score = 0; paused = false; settingsOpen = false;
  state = "start";
}
function startGame() {
  state = "playing";
  player.lives = cfg.lives;
  respawnPlayer();
  enemies = []; spawned = 0;
  for (let i = 0; i < cfg.maxOnScreen; i++) spawnEnemy();
}
function respawnPlayer() {
  player.x = PLAYER_SPAWN.x; player.y = PLAYER_SPAWN.y;
  player.dir = DIRS[0]; player.alive = true; player.invincible = 2; player.fireCd = 0;
}
function freeSpawnPoint() {
  const pts = ENEMY_SPAWNS.slice().sort(() => Math.random() - 0.5);
  for (const pt of pts) {
    const probe = { x: pt.x, y: pt.y, w: TANK_SIZE, h: TANK_SIZE };
    if (player.alive && overlap(probe, tankRect(player))) continue;
    if (enemies.some(e => e.alive && overlap(probe, tankRect(e)))) continue;
    return pt;
  }
  return null;
}
function spawnEnemy() {
  if (spawned >= cfg.totalEnemies) return false;
  const pt = freeSpawnPoint();
  if (!pt) return false;
  enemies.push(makeEnemy(pt.x, pt.y));
  spawned++;
  return true;
}

// ---------- 碰撞 ----------
function tankBlocked(t) {
  if (!inField(t)) return true;
  const r = tankRect(t);
  for (const w of walls) if (w.alive && overlap(r, w)) return true;
  if (!t.isPlayer && player.alive && overlap(r, tankRect(player))) return true;
  for (const e of enemies) if (e !== t && e.alive && overlap(r, tankRect(e))) return true;
  return false;
}
function tryMove(t, dt) {
  const step = (t.isPlayer ? cfg.playerSpeed : cfg.enemySpeed) * dt;
  const d = t.dir;
  t.x += d.dx * step;
  if (tankBlocked(t)) { t.x -= d.dx * step; }
  t.y += d.dy * step;
  if (tankBlocked(t)) { t.y -= d.dy * step; }
}

function fire(t, dir) {
  const speed = cfg.bulletSpeed;
  bullets.push({ x: t.x + dir.dx * (TANK_SIZE/2), y: t.y + dir.dy * (TANK_SIZE/2),
                 dx: dir.dx, dy: dir.dy, speed, alive: true, fromPlayer: t.isPlayer });
}

function addExplosion(x, y, big) {
  explosions.push({ x, y, t: 0, big, alive: true });
}
function addPopup(x, y, text) {
  popups.push({ x, y, text, t: 0, alive: true });
}

// ---------- 更新 ----------
function update(dt) {
  for (const ex of explosions) { ex.t += dt; if (ex.t > 0.4) ex.alive = false; }
  for (const pp of popups) { pp.t += dt; if (pp.t > 0.9) pp.alive = false; }
  explosions = explosions.filter(e => e.alive);
  popups = popups.filter(p => p.alive);

  if (state !== "playing" || paused || settingsOpen) return;

  // 玩家
  const p = player;
  if (p.fireCd > 0) p.fireCd -= dt;
  if (p.invincible > 0) p.invincible -= dt;
  if (p.alive) {
    let dir = null;
    if (keys["arrowup"] || keys["w"]) dir = DIRS[0];
    else if (keys["arrowdown"] || keys["s"]) dir = DIRS[1];
    else if (keys["arrowleft"] || keys["a"]) dir = DIRS[2];
    else if (keys["arrowright"] || keys["d"]) dir = DIRS[3];
    if (dir) { p.dir = dir; tryMove(p, dt); }
    if (keys[" "] && p.fireCd <= 0) {
      fire(p, p.dir);
      p.fireCd = cfg.fireCd;
    }
  }

  // 敌人
  for (const e of enemies) {
    if (!e.alive) continue;
    e.fireTimer -= dt;
    if (Math.random() < dt * 0.6) { e.dir = DIRS[Math.floor(rnd(0,4))]; }
    const before = { x: e.x, y: e.y };
    tryMove(e, dt);
    if (e.x === before.x && e.y === before.y) { e.dir = DIRS[Math.floor(rnd(0,4))]; } // 撞墙转向
    if (e.fireTimer <= 0) {
      let dir = e.dir;
      if (Math.random() < 0.4 && player.alive) {
        dir = { dx: Math.sign(player.x - e.x) || 0, dy: Math.sign(player.y - e.y) || 0 };
        if (dir.dx === 0 && dir.dy === 0) dir = e.dir;
      }
      fire(e, dir);
      e.fireTimer = rnd(cfg.enemyFire[0], cfg.enemyFire[1]);
    }
  }

  // 子弹
  for (const b of bullets) {
    if (!b.alive) continue;
    b.x += b.dx * b.speed * dt;
    b.y += b.dy * b.speed * dt;
    const br = { x: b.x - BULLET_SIZE/2, y: b.y - BULLET_SIZE/2, w: BULLET_SIZE, h: BULLET_SIZE };
    let dead = false;
    // 边界
    if (br.x < 0 || br.y < HUD_H || br.x + br.w > SCREEN_W || br.y + br.h > HUD_H + ROWS*TILE) dead = true;
    // 墙
    if (!dead) {
      for (const w of walls) {
        if (w.alive && overlap(br, w)) {
          dead = true;
          if (w.kind === "brick") { w.alive = false; score += 5; addExplosion(w.x + w.w/2, w.y + w.h/2, false); }
          else { addExplosion(b.x, b.y, false); }
          break;
        }
      }
    }
    // 坦克
    if (!dead) {
      if (b.fromPlayer) {
        for (const e of enemies) {
          if (e.alive && overlap(br, tankRect(e))) {
            dead = true; e.alive = false;
            score += 100;
            addExplosion(e.x, e.y, true);
            addPopup(e.x, e.y, "+100");
            break;
          }
        }
      } else {
        if (player.alive && overlap(br, tankRect(player))) {
          dead = true;
          hitPlayer();
        }
      }
    }
    if (dead) b.alive = false;
  }
  bullets = bullets.filter(b => b.alive);
  enemies = enemies.filter(e => e.alive);

  // 敌人重生
  if (respawnTimer > 0) respawnTimer -= dt;
  if (enemies.length < cfg.maxOnScreen && spawned < cfg.totalEnemies && respawnTimer <= 0) {
    if (spawnEnemy()) respawnTimer = 1.0;
  }
  // 胜负判定
  if (state === "playing" && spawned >= cfg.totalEnemies && enemies.length === 0) state = "win";
}

function hitPlayer() {
  const p = player;
  if (p.invincible > 0) return;
  p.lives--;
  addExplosion(p.x, p.y, true);
  if (p.lives <= 0) { p.alive = false; state = "gameover"; }
  else respawnPlayer();
}

// ---------- 绘制 ----------
function drawTank(x, y, dir, color, dark, invincible) {
  if (invincible && Math.floor(Date.now() / 80) % 2 === 0) ctx.globalAlpha = 0.35;
  // 履带
  ctx.fillStyle = dark;
  if (dir.dx !== 0) {
    ctx.fillRect(x - 16, y - 16, 32, 6);
    ctx.fillRect(x - 16, y + 10, 32, 6);
  } else {
    ctx.fillRect(x - 16, y - 16, 6, 32);
    ctx.fillRect(x + 10, y - 16, 6, 32);
  }
  // 车身
  ctx.fillStyle = color;
  ctx.fillRect(x - 13, y - 13, 26, 26);
  // 炮塔
  ctx.fillStyle = dark;
  ctx.fillRect(x - 6, y - 6, 12, 12);
  // 炮管
  ctx.fillStyle = color;
  ctx.fillRect(x + dir.dx*10 - 2, y + dir.dy*10 - 2, 4 + Math.abs(dir.dx)*8, 4 + Math.abs(dir.dy)*8);
  ctx.globalAlpha = 1;
}

function drawField() {
  // 背景
  if (bgReady) {
    ctx.drawImage(bgImg, 0, 0, SCREEN_W, SCREEN_H);
  } else {
    ctx.fillStyle = "#0f0f14"; ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  }
  // 战场半透明底，保证清晰
  ctx.fillStyle = C.field;
  ctx.fillRect(0, HUD_H, SCREEN_W, ROWS*TILE);
  // 出生点标记
  ctx.fillStyle = "rgba(120,120,140,.5)";
  for (const pt of ENEMY_SPAWNS) { ctx.beginPath(); ctx.arc(pt.x, pt.y, 4, 0, Math.PI*2); ctx.fill(); }
  // 墙
  for (const w of walls) {
    if (!w.alive) continue;
    if (w.kind === "brick") {
      ctx.fillStyle = C.brick; ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.strokeStyle = C.brickDark; ctx.lineWidth = 2;
      ctx.strokeRect(w.x+1, w.y+1, w.w-2, w.h-2);
      ctx.beginPath(); ctx.moveTo(w.x, w.y + w.h/2); ctx.lineTo(w.x + w.w, w.y + w.h/2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(w.x + w.w/2, w.y); ctx.lineTo(w.x + w.w/2, w.y + w.h); ctx.stroke();
    } else {
      ctx.fillStyle = C.steel; ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.strokeStyle = C.steelLight; ctx.lineWidth = 2; ctx.strokeRect(w.x+2, w.y+2, w.w-4, w.h-4);
      ctx.fillStyle = C.steelDark; ctx.fillRect(w.x + w.w/2 - 3, w.y + w.h/2 - 3, 6, 6);
    }
  }
}

function drawHUD() {
  ctx.fillStyle = C.hud; ctx.fillRect(0, 0, SCREEN_W, HUD_H);
  ctx.strokeStyle = C.line; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, HUD_H); ctx.lineTo(SCREEN_W, HUD_H); ctx.stroke();

  ctx.textBaseline = "top";
  // 作者标签（左上角）
  ctx.fillStyle = C.author; ctx.font = "bold 13px Microsoft YaHei, sans-serif";
  ctx.fillText("作者 WosoW睿", 6, 5);

  const remaining = cfg.totalEnemies - spawned + enemies.length;
  ctx.fillStyle = C.text; ctx.font = "bold 20px Microsoft YaHei, sans-serif";
  ctx.fillText("得分 SCORE  " + score, 16, 26);
  ctx.fillText("生命 LIVES  " + Math.max(0, player.lives), 236, 26);
  ctx.fillText("敌人 ENEMY  " + remaining, 456, 26);

  ctx.fillStyle = C.hint; ctx.font = "13px Microsoft YaHei, sans-serif";
  ctx.fillText("方向键 / WASD 移动    空格 开火    P 暂停    R 重开    Esc 退出", 16, HUD_H - 20);
}

// 右上角按钮
const BTN_SIZE = 36, BTN_GAP = 6, BTN_MARGIN = 10;
const BTN_Y = (HUD_H - BTN_SIZE) / 2;
const RIGHT = SCREEN_W - BTN_MARGIN;
function btnRect(i) { return { x: RIGHT - (i+1)*BTN_SIZE - i*BTN_GAP, y: BTN_Y, w: BTN_SIZE, h: BTN_SIZE }; }
const BTNS = { pause: 2, restart: 1, settings: 0 };

function drawButtons() {
  const mouse = getLogicalMouse();
  for (const name of ["pause", "restart", "settings"]) {
    const r = btnRect(BTNS[name]);
    const hover = pointIn(mouse, r);
    ctx.fillStyle = hover ? "#406eb3" : "#263e70";
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = hover ? "#78aaf0" : "#46649a"; ctx.lineWidth = 2;
    ctx.strokeRect(r.x+1, r.y+1, r.w-2, r.h-2);
    ctx.fillStyle = "#e1e8f5";
    const cx = r.x + r.w/2, cy = r.y + r.h*0.38;
    if (name === "pause") {
      ctx.fillRect(cx - 6, cy - 9, 4, 18); ctx.fillRect(cx + 3, cy - 9, 4, 18);
    } else if (name === "restart") {
      ctx.beginPath(); ctx.arc(cx, cy, 9, -Math.PI/2, Math.PI*1.4); ctx.lineWidth = 3; ctx.strokeStyle = "#e1e8f5"; ctx.stroke();
      // 箭头
      ctx.beginPath(); ctx.moveTo(cx+9, cy-9); ctx.lineTo(cx+14, cy-4); ctx.lineTo(cx+4, cy-4); ctx.closePath(); ctx.fill();
    } else {
      ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx - 9, cy, 4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 9, cy, 4, 0, Math.PI*2); ctx.fill();
    }
    // 文字标签
    ctx.fillStyle = "#b9c6e0"; ctx.font = "10px Microsoft YaHei, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(name === "pause" ? "暂停" : name === "restart" ? "重开" : "设置", cx, r.y + r.h - 12);
    ctx.textAlign = "left";
  }
}

function pointIn(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }

// 设置面板
const SETTINGS_PANEL = (() => {
  const pw = SCREEN_W * 0.4, ph = 300;
  const r = { x: (SCREEN_W - pw)/2, y: (SCREEN_H - ph)/2, w: pw, h: ph };
  return r;
})();
const DIFF_BTNS = DIFF_ORDER.map((k, i) => ({
  key: k, x: SETTINGS_PANEL.x + 40, y: SETTINGS_PANEL.y + 110 + i*52, w: SETTINGS_PANEL.w - 80, h: 42,
}));
const CLOSE_BTN = { x: SETTINGS_PANEL.x + SETTINGS_PANEL.w/2 - 60, y: SETTINGS_PANEL.y + SETTINGS_PANEL.h - 56, w: 120, h: 40 };

function drawSettings() {
  if (!settingsOpen) return;
  ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  ctx.fillStyle = "#181c28"; ctx.fillRect(SETTINGS_PANEL.x, SETTINGS_PANEL.y, SETTINGS_PANEL.w, SETTINGS_PANEL.h);
  ctx.strokeStyle = "#5a6ea0"; ctx.lineWidth = 2; ctx.strokeRect(SETTINGS_PANEL.x, SETTINGS_PANEL.y, SETTINGS_PANEL.w, SETTINGS_PANEL.h);
  ctx.fillStyle = "#fff"; ctx.font = "bold 30px Microsoft YaHei, sans-serif"; ctx.textAlign = "center";
  ctx.fillText("设 置", SCREEN_W/2, SETTINGS_PANEL.y + 52);
  ctx.fillStyle = "#96bee9"; ctx.font = "16px Microsoft YaHei, sans-serif";
  ctx.fillText("选择难度", SCREEN_W/2, SETTINGS_PANEL.y + 86);
  const mouse = getLogicalMouse();
  for (const b of DIFF_BTNS) {
    const sel = b.key === difficulty;
    const hover = pointIn(mouse, b);
    ctx.fillStyle = sel ? "#2e7842" : (hover ? "#384660" : "#242a3a");
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = sel ? "#6ed28c" : (hover ? "#78aaf0" : "#465064"); ctx.lineWidth = 2;
    ctx.strokeRect(b.x+1, b.y+1, b.w-2, b.h-2);
    ctx.fillStyle = "#fff"; ctx.font = "bold 18px Microsoft YaHei, sans-serif";
    ctx.fillText(DIFF[b.key].label + (sel ? "  ✓" : ""), SCREEN_W/2, b.y + 11);
  }
  const ch = pointIn(mouse, CLOSE_BTN);
  ctx.fillStyle = ch ? "#406eb3" : "#263e70"; ctx.fillRect(CLOSE_BTN.x, CLOSE_BTN.y, CLOSE_BTN.w, CLOSE_BTN.h);
  ctx.strokeStyle = ch ? "#78aaf0" : "#46649a"; ctx.strokeRect(CLOSE_BTN.x, CLOSE_BTN.y, CLOSE_BTN.w, CLOSE_BTN.h);
  ctx.fillStyle = "#fff"; ctx.font = "bold 16px Microsoft YaHei, sans-serif";
  ctx.fillText("关 闭", SCREEN_W/2, CLOSE_BTN.y + 10);
  ctx.textAlign = "left";
}

function drawOverlay(title, sub, hint) {
  ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#fff"; ctx.font = "bold 48px Microsoft YaHei, sans-serif";
  ctx.fillText(title, SCREEN_W/2, SCREEN_H/2 - 60);
  ctx.fillStyle = "#dcdcdc"; ctx.font = "20px Microsoft YaHei, sans-serif";
  ctx.fillText(sub, SCREEN_W/2, SCREEN_H/2 - 12);
  if (hint) { ctx.fillStyle = "#9696a5"; ctx.font = "14px Microsoft YaHei, sans-serif"; ctx.fillText(hint, SCREEN_W/2, SCREEN_H/2 + 22); }
  ctx.textAlign = "left"; ctx.textBaseline = "top";
}

function drawStartDifficulty() {
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "#96bee9"; ctx.font = "16px Microsoft YaHei, sans-serif";
  ctx.fillText("选择难度", SCREEN_W/2, SCREEN_H/2 + 50);
  const mouse = getLogicalMouse();
  const w = 90, gap = 16, total = w*3 + gap*2;
  const sx = SCREEN_W/2 - total/2, sy = SCREEN_H/2 + 72;
  DIFF_ORDER.forEach((k, i) => {
    const r = { x: sx + i*(w+gap), y: sy, w, h: 40 };
    const sel = k === difficulty, hover = pointIn(mouse, r);
    ctx.fillStyle = sel ? "#2e7842" : (hover ? "#384660" : "#242a3a");
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = sel ? "#6ed28c" : (hover ? "#78aaf0" : "#465064"); ctx.lineWidth = 2;
    ctx.strokeRect(r.x+1, r.y+1, r.w-2, r.h-2);
    ctx.fillStyle = "#fff"; ctx.font = "bold 17px Microsoft YaHei, sans-serif";
    ctx.fillText(DIFF[k].label, r.x + w/2, r.y + 20);
  });
  ctx.textAlign = "left"; ctx.textBaseline = "top";
}

function draw() {
  drawField();
  // 实体
  for (const b of bullets) {
    ctx.fillStyle = "#ffe08a";
    ctx.fillRect(b.x - BULLET_SIZE/2, b.y - BULLET_SIZE/2, BULLET_SIZE, BULLET_SIZE);
  }
  for (const e of enemies) if (e.alive) drawTank(e.x, e.y, e.dir, C.enemy, C.enemyDark, false);
  if (player.alive) drawTank(player.x, player.y, player.dir, C.player, C.playerDark, player.invincible > 0);
  for (const ex of explosions) {
    const r = (ex.big ? 34 : 18) * Math.min(1, ex.t / 0.4);
    ctx.globalAlpha = 1 - ex.t / 0.4;
    ctx.fillStyle = "#ff9f43"; ctx.beginPath(); ctx.arc(ex.x, ex.y, r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#ffe08a"; ctx.beginPath(); ctx.arc(ex.x, ex.y, r*0.6, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (const pp of popups) {
    ctx.globalAlpha = Math.max(0, 1 - pp.t / 0.9);
    ctx.fillStyle = "#ffd76a"; ctx.font = "bold 16px Microsoft YaHei, sans-serif";
    ctx.fillText(pp.text, pp.x - 18, pp.y - 20 - pp.t*30);
    ctx.globalAlpha = 1;
  }

  drawHUD();
  drawButtons();

  // 覆盖层
  if (settingsOpen) { drawSettings(); }
  else if (state === "start") {
    drawOverlay("坦克大战 Tank Battle", "地图：内置   难度：" + cfg.label + "   按 空格 / 回车 开始",
                "右上角：暂停 / 重开 / 设置（选择难度）");
    drawStartDifficulty();
  } else if (state === "win") {
    drawOverlay("胜 利 !", "得分 " + score + "   ·   按 R 重新开始   ·   Esc 退出");
  } else if (state === "gameover") {
    drawOverlay("游 戏 结 束", "得分 " + score + "   ·   按 R 重新开始   ·   Esc 退出");
  } else if (paused) {
    drawOverlay("已 暂 停", "按 P 继续");
  }
}

// ---------- 鼠标 ----------
let mouse = { x: -9999, y: -9999 };
function getLogicalMouse() { return mouse; }
canvas.addEventListener("mousemove", e => {
  const r = canvas.getBoundingClientRect();
  mouse = { x: (e.clientX - r.left) * (SCREEN_W / r.width), y: (e.clientY - r.top) * (SCREEN_H / r.height) };
});
canvas.addEventListener("mouseleave", () => { mouse = { x: -9999, y: -9999 }; });
canvas.addEventListener("click", e => {
  const r = canvas.getBoundingClientRect();
  const p = { x: (e.clientX - r.left) * (SCREEN_W / r.width), y: (e.clientY - r.top) * (SCREEN_H / r.height) };
  // 设置面板优先
  if (settingsOpen) {
    if (pointIn(p, CLOSE_BTN)) { settingsOpen = false; return; }
    for (const b of DIFF_BTNS) {
      if (pointIn(p, b)) {
        setDifficulty(b.key);
        return;
      }
    }
    return;
  }
  // 右上角按钮
  for (const name of ["pause", "restart", "settings"]) {
    if (pointIn(p, btnRect(BTNS[name]))) {
      if (name === "pause") { if (state === "playing") paused = !paused; }
      else if (name === "restart") { resetToStart(); state = "playing"; startGame(); }
      else if (name === "settings") { settingsOpen = true; }
      return;
    }
  }
  // 开始界面的难度按钮
  if (state === "start") {
    const w = 90, gap = 16, total = w*3 + gap*2;
    const sx = SCREEN_W/2 - total/2, sy = SCREEN_H/2 + 72;
    DIFF_ORDER.forEach((k, i) => {
      if (pointIn(p, { x: sx + i*(w+gap), y: sy, w, h: 40 })) setDifficulty(k);
    });
  }
});

function setDifficulty(k) {
  difficulty = k;
  cfg = DIFF[k];
  const keepOpen = settingsOpen;
  resetToStart();
  settingsOpen = keepOpen;
}

// ---------- 主循环 ----------
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ---------- 启动 ----------
resetToStart();
requestAnimationFrame(loop);
</script>
</body>
</html>
